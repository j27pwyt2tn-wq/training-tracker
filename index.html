<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Training</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      --bg:#f6f7f8;
      --card:#ffffff;
      --text:#16181d;
      --muted:#717782;
      --line:#dde1e6;
      --accent:#198754;
      --accent-soft:#e7f5ec;
      --danger:#c9362b;
      --danger-soft:#fdeceb;
      --shadow:0 1px 2px rgba(0,0,0,.05);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:980px;margin:0 auto;padding:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .title{font-size:22px;font-weight:700;letter-spacing:-.02em}
    .subtitle{font-size:12px;color:var(--muted);margin-top:2px}
    .nav{
      display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;
      background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);
    }
    .month-name{text-align:center;font-weight:700}
    .icon-btn,.small-btn,.ghost-btn{
      border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:42px;color:var(--text);
    }
    .week-tabs{
      display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 12px;
    }
    .week-tab{
      min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;
    }
    .week-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .metrics{
      display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px
    }
    .metric{
      background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--shadow)
    }
    .metric .label{font-size:11px;color:var(--muted)}
    .metric .value{font-size:18px;font-weight:700;margin-top:2px}
    .day-card,.body-card,.month-summary{
      background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    }
    .day-card{padding:12px;margin-bottom:10px}
    .day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .day-name{font-weight:700}
    .day-total{font-size:12px;color:var(--muted)}
    .sessions{display:grid;gap:8px}
    .session-row{
      display:grid;grid-template-columns:1.5fr .9fr .9fr .9fr 42px;gap:8px;
      padding:8px;border:1px solid var(--line);border-radius:12px;background:#fbfbfc;
    }
    select,input[type=number]{
      width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 9px;
      outline:none;font-size:16px;
    }
    select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
    .field-wrap .mini{font-size:10px;color:var(--muted);margin-bottom:3px}
    .remove-btn{
      min-height:40px;border:1px solid #f2c0bc;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-weight:700
    }
    .add-row{margin-top:8px}
    .ghost-btn{padding:0 12px;font-size:13px;background:#fff}
    .body-card{margin-top:12px;padding:12px}
    .body-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
    .month-summary{margin-top:12px;padding:12px}
    .month-summary h3{margin:0 0 10px;font-size:15px}
    .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .summary-box{background:#f8f9fa;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
    .summary-box .k{font-size:10px;color:var(--muted)}
    .summary-box .v{font-size:15px;font-weight:700;margin-top:2px}
    .footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .small-btn{padding:0 12px;font-size:13px}
    .small-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .small-btn.danger{color:var(--danger)}
    .notice{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
    .status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}
    @media (max-width:700px){
      .app{padding:10px}
      .title{font-size:20px}
      .week-tabs{gap:5px}
      .week-tab{min-height:40px;font-size:13px}
      .metrics{grid-template-columns:repeat(4,1fr)}
      .metric{padding:8px 4px}
      .metric .value{font-size:16px}
      .summary-grid{grid-template-columns:repeat(3,1fr)}
      .session-row{
        grid-template-columns:1fr 1fr;
      }
      .session-row .remove-btn{
        grid-column:2;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <div class="title">Training</div>
        <div class="subtitle">Multiple exercises per day</div>
      </div>
    </div>

    <section class="nav" aria-label="Month navigation">
      <button id="prevMonth" class="icon-btn" aria-label="Previous month">‹</button>
      <div class="month-name" id="monthName"></div>
      <button id="nextMonth" class="icon-btn" aria-label="Next month">›</button>
    </section>

    <div class="week-tabs" id="weekTabs"></div>

    <section class="metrics">
      <div class="metric"><div class="label">Sessions</div><div class="value" id="summarySessions">0</div></div>
      <div class="metric"><div class="label">Minutes</div><div class="value" id="summaryTime">0</div></div>
      <div class="metric"><div class="label">Km</div><div class="value" id="summaryKm">0.0</div></div>
      <div class="metric"><div class="label">Kcal</div><div class="value" id="summaryCalories">0</div></div>
    </section>

    <section id="daysContainer"></section>

    <section class="body-card">
      <div class="body-grid">
        <label>
          <span class="field-label">Friday weight (kg)</span>
          <input id="weight" type="number" min="30" max="300" step="0.1" inputmode="decimal" placeholder="87.6" />
        </label>
        <label>
          <span class="field-label">Friday waist (cm)</span>
          <input id="waist" type="number" min="30" max="250" step="0.1" inputmode="decimal" placeholder="98" />
        </label>
      </div>
    </section>

    <section class="month-summary">
      <h3>Month summary</h3>
      <div class="summary-grid">
        <div class="summary-box"><div class="k">Sessions</div><div class="v" id="monthSessions">0</div></div>
        <div class="summary-box"><div class="k">Minutes</div><div class="v" id="monthMinutes">0</div></div>
        <div class="summary-box"><div class="k">Km</div><div class="v" id="monthKm">0.0</div></div>
        <div class="summary-box"><div class="k">Kcal</div><div class="v" id="monthCalories">0</div></div>
        <div class="summary-box"><div class="k">Weight Δ</div><div class="v" id="monthWeightDelta">—</div></div>
      </div>
    </section>

    <div class="footer-actions">
      <button id="exportData" class="small-btn primary">Export backup</button>
      <label class="small-btn" style="display:inline-flex;align-items:center">
        Import backup
        <input id="importData" type="file" accept="application/json" hidden>
      </label>
      <button id="clearWeek" class="small-btn danger">Clear this week</button>
    </div>

    <div class="notice">
      Your entries are stored in this browser on this device. Export a backup occasionally if you want to keep a copy.
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script>
  (() => {
    const STORAGE_KEY = "joao-training-tracker-v2";
    const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const exercises = ["Indoor cycling","Outdoor cycling","Walking","Running","Strength training","Swimming","Football","Other"];

    let currentYear = 2026;
    let currentMonth = 8;
    let currentWeek = 3;

    const monthName = document.getElementById("monthName");
    const weekTabs = document.getElementById("weekTabs");
    const daysContainer = document.getElementById("daysContainer");
    const statusEl = document.getElementById("status");

    function blankSession(){
      return {exercise:"Indoor cycling", time:"", km:"", calories:""};
    }
    function blankDay(){
      return {sessions:[]};
    }
    function blankWeek(){
      return {days: Array.from({length:7}, blankDay), weight:"", waist:""};
    }
    function defaultData(){
      return {months:{}};
    }
    function loadData(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : defaultData();
      }catch(e){
        return defaultData();
      }
    }
    let data = loadData();

    function monthKey(y,m){ return `${y}-${String(m+1).padStart(2,"0")}`; }
    function ensureMonth(y,m){
      const key = monthKey(y,m);
      if(!data.months[key]){
        data.months[key] = {weeks:[blankWeek(),blankWeek(),blankWeek(),blankWeek(),blankWeek()]};
      }
      while(data.months[key].weeks.length < 5) data.months[key].weeks.push(blankWeek());
      data.months[key].weeks.forEach(w => {
        while(w.days.length < 7) w.days.push(blankDay());
        w.days.forEach(d => {
          if(!Array.isArray(d.sessions)) d.sessions = [];
        });
      });
      return data.months[key];
    }
    function getWeek(){ return ensureMonth(currentYear,currentMonth).weeks[currentWeek-1]; }

    function saveData(msg="Saved"){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      statusEl.textContent = msg;
      window.clearTimeout(saveData._t);
      saveData._t = window.setTimeout(()=> statusEl.textContent="", 1400);
    }

    function fmtMonth(){
      return new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"}).format(new Date(currentYear,currentMonth,1));
    }

    function renderTabs(){
      weekTabs.innerHTML="";
      for(let i=1;i<=5;i++){
        const b=document.createElement("button");
        b.type="button";
        b.className="week-tab"+(i===currentWeek?" active":"");
        b.textContent="W"+i;
        b.addEventListener("click",()=>{ currentWeek=i; render(); });
        weekTabs.appendChild(b);
      }
    }

    function numberVal(v){
      const n=Number(v);
      return Number.isFinite(n)&&n>=0?n:0;
    }

    function dayTotals(day){
      let sessions=0,time=0,km=0,cal=0;
      day.sessions.forEach(s=>{
        const hasSomething = (s.exercise && s.exercise.trim()) || s.time || s.km || s.calories;
        if(hasSomething) sessions++;
        time += numberVal(s.time);
        km += numberVal(s.km);
        cal += numberVal(s.calories);
      });
      return {sessions,time,km,cal};
    }

    function createField(label, el){
      const wrap = document.createElement("div");
      wrap.className = "field-wrap";
      const mini = document.createElement("div");
      mini.className = "mini";
      mini.textContent = label;
      wrap.appendChild(mini);
      wrap.appendChild(el);
      return wrap;
    }

    function renderDays(){
      daysContainer.innerHTML="";
      const week=getWeek();

      week.days.forEach((day, dayIndex)=>{
        const card=document.createElement("section");
        card.className="day-card";

        const head=document.createElement("div");
        head.className="day-head";

        const left=document.createElement("div");
        const name=document.createElement("div");
        name.className="day-name";
        name.textContent=days[dayIndex];
        const total=document.createElement("div");
        total.className="day-total";
        const t=dayTotals(day);
        total.textContent = `${t.sessions} session${t.sessions===1?"":"s"} · ${Math.round(t.time)} min · ${t.km.toFixed(1)} km · ${Math.round(t.cal)} kcal`;
        left.append(name,total);

        const addBtn=document.createElement("button");
        addBtn.type="button";
        addBtn.className="ghost-btn";
        addBtn.textContent="+ Add exercise";
        addBtn.addEventListener("click",()=>{
          day.sessions.push(blankSession());
          saveData("Exercise added");
          render();
        });

        head.append(left,addBtn);

        const sessions=document.createElement("div");
        sessions.className="sessions";

        if(day.sessions.length===0){
          const empty=document.createElement("div");
          empty.className="day-total";
          empty.textContent="No exercises yet.";
          sessions.appendChild(empty);
        } else {
          day.sessions.forEach((session, sessionIndex)=>{
            const row=document.createElement("div");
            row.className="session-row";

            const sel=document.createElement("select");
            exercises.forEach(ex=>{
              const o=document.createElement("option");
              o.value=ex;
              o.textContent=ex;
              if(session.exercise===ex) o.selected=true;
              sel.appendChild(o);
            });
            sel.addEventListener("change",()=>{
              day.sessions[sessionIndex].exercise=sel.value;
              saveData();
              updateSummaries();
              renderDaysOnlyTotals();
            });

            const time=document.createElement("input");
            time.type="number"; time.min="0"; time.step="1"; time.inputMode="decimal"; time.value=session.time ?? "";
            time.addEventListener("input",()=>{
              day.sessions[sessionIndex].time=time.value;
              saveData();
              updateSummaries();
              renderDaysOnlyTotals();
            });

            const km=document.createElement("input");
            km.type="number"; km.min="0"; km.step="0.1"; km.inputMode="decimal"; km.value=session.km ?? "";
            km.addEventListener("input",()=>{
              day.sessions[sessionIndex].km=km.value;
              saveData();
              updateSummaries();
              renderDaysOnlyTotals();
            });

            const cal=document.createElement("input");
            cal.type="number"; cal.min="0"; cal.step="1"; cal.inputMode="decimal"; cal.value=session.calories ?? "";
            cal.addEventListener("input",()=>{
              day.sessions[sessionIndex].calories=cal.value;
              saveData();
              updateSummaries();
              renderDaysOnlyTotals();
            });

            const remove=document.createElement("button");
            remove.type="button";
            remove.className="remove-btn";
            remove.textContent="×";
            remove.setAttribute("aria-label","Remove exercise");
            remove.addEventListener("click",()=>{
              day.sessions.splice(sessionIndex,1);
              saveData("Exercise removed");
              render();
            });

            row.appendChild(createField("Exercise", sel));
            row.appendChild(createField("Min", time));
            row.appendChild(createField("Km", km));
            row.appendChild(createField("Calories", cal));
            row.appendChild(remove);
            sessions.appendChild(row);
          });
        }

        card.append(head, sessions);
        daysContainer.appendChild(card);
      });
    }

    function renderDaysOnlyTotals(){
      const cards = daysContainer.querySelectorAll(".day-card");
      const week = getWeek();
      cards.forEach((card, i) => {
        const totalEl = card.querySelector(".day-total");
        const t = dayTotals(week.days[i]);
        totalEl.textContent = `${t.sessions} session${t.sessions===1?"":"s"} · ${Math.round(t.time)} min · ${t.km.toFixed(1)} km · ${Math.round(t.cal)} kcal`;
      });
    }

    function updateSummaries(){
      const week=getWeek();
      let sessions=0,time=0,km=0,cal=0;
      week.days.forEach(day=>{
        day.sessions.forEach(s=>{
          const hasSomething = (s.exercise && s.exercise.trim()) || s.time || s.km || s.calories;
          if(hasSomething) sessions++;
          time += numberVal(s.time);
          km += numberVal(s.km);
          cal += numberVal(s.calories);
        });
      });
      document.getElementById("summarySessions").textContent=sessions;
      document.getElementById("summaryTime").textContent=Math.round(time);
      document.getElementById("summaryKm").textContent=km.toFixed(1);
      document.getElementById("summaryCalories").textContent=Math.round(cal);
      updateMonthSummary();
    }

    function updateMonthSummary(){
      const month=ensureMonth(currentYear,currentMonth);
      let sessions=0,time=0,km=0,cal=0;
      const weights=[];
      month.weeks.forEach(w=>{
        w.days.forEach(day=>{
          day.sessions.forEach(s=>{
            const hasSomething = (s.exercise && s.exercise.trim()) || s.time || s.km || s.calories;
            if(hasSomething) sessions++;
            time+=numberVal(s.time);
            km+=numberVal(s.km);
            cal+=numberVal(s.calories);
          });
        });
        const wt=Number(w.weight);
        if(Number.isFinite(wt)&&wt>0) weights.push(wt);
      });
      document.getElementById("monthSessions").textContent=sessions;
      document.getElementById("monthMinutes").textContent=Math.round(time);
      document.getElementById("monthKm").textContent=km.toFixed(1);
      document.getElementById("monthCalories").textContent=Math.round(cal);
      const delta=weights.length>=2 ? weights[weights.length-1]-weights[0] : null;
      document.getElementById("monthWeightDelta").textContent = delta===null ? "—" : `${delta>0?"+":""}${delta.toFixed(1)} kg`;
    }

    function render(){
      ensureMonth(currentYear,currentMonth);
      monthName.textContent=fmtMonth();
      renderTabs();
      renderDays();
      const week=getWeek();
      document.getElementById("weight").value=week.weight ?? "";
      document.getElementById("waist").value=week.waist ?? "";
      updateSummaries();
    }

    document.getElementById("prevMonth").addEventListener("click",()=>{
      currentMonth--;
      if(currentMonth<0){currentMonth=11;currentYear--;}
      currentWeek=1;
      render();
    });
    document.getElementById("nextMonth").addEventListener("click",()=>{
      currentMonth++;
      if(currentMonth>11){currentMonth=0;currentYear++;}
      currentWeek=1;
      render();
    });

    document.getElementById("weight").addEventListener("input",(e)=>{
      getWeek().weight=e.target.value;
      saveData();
      updateMonthSummary();
    });
    document.getElementById("waist").addEventListener("input",(e)=>{
      getWeek().waist=e.target.value;
      saveData();
    });

    document.getElementById("clearWeek").addEventListener("click",()=>{
      if(!confirm("Clear all data for this week?")) return;
      ensureMonth(currentYear,currentMonth).weeks[currentWeek-1]=blankWeek();
      saveData("Week cleared");
      render();
    });

    document.getElementById("exportData").addEventListener("click",()=>{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download="training-backup.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),500);
    });

    document.getElementById("importData").addEventListener("change",(e)=>{
      const file=e.target.files?.[0];
      if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const parsed=JSON.parse(reader.result);
          if(!parsed || typeof parsed!=="object" || !parsed.months) throw new Error();
          data=parsed;
          saveData("Backup imported");
          render();
        }catch(err){
          statusEl.textContent="Could not import that backup file.";
        }
      };
      reader.readAsText(file);
      e.target.value="";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }

    render();
  })();
  </script>
</body>
</html>
